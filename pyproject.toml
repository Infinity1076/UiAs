[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uias-artifact"
version = "0.1.0"
description = "Anonymous research artifact for multimodal wireless face anti-spoofing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["uias*"]
